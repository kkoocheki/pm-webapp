services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: pm-fuseki
    ports:
      - "3030:3030"
    volumes:
      - ./fuseki/config.ttl:/fuseki/config.ttl:ro
      - ./fuseki/rules:/fuseki/rules:ro
      - ./fuseki/ontology:/fuseki/ontology:ro
      - fuseki-data:/fuseki/databases
    environment:
      - ADMIN_PASSWORD=admin
      - JVM_ARGS=-Xmx2g
    command: ["--config=/fuseki/config.ttl"]

volumes:
  fuseki-data:
    driver: local
